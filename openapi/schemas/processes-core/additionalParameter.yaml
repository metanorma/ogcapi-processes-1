description: >-
  An additional parameter of a process, beyond its declared inputs and outputs.
type: object
required:
  - name
  - value
properties:
   name:
      type: string
   value:
      type: array
      items:
         oneOf:
           - type: string
           - type: number
           - type: integer
           - type: array
             items: {}
           - type: object
